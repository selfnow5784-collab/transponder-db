<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Transponder Key Database - Offline inventory and vehicle reference" />
    <title>Transponder Key Database</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .tab-container {
            display: flex;
            background-color: #333;
            border-bottom: 2px solid #333;
            border-radius: 10px 10px 0 0;
            overflow: hidden;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            color: hotpink;
            background-color: black;
            border-radius: 10px 10px 0 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .tab.active {
            background-color: hotpink;
            color: black;
        }

        .tab-content {
            display: none;
            padding: 20px;
        }

        .tab-content.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #eee;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            position: relative;
        }
        
        th:hover {
            background: #ddd;
        }
        
        th.sortable::after {
            content: ' ⇅';
            color: #999;
            font-size: 0.8em;
        }
        
        th.sorted-asc::after {
            content: ' ▲';
            color: hotpink;
        }
        
        th.sorted-desc::after {
            content: ' ▼';
            color: hotpink;
        }

        #searchInput, #inventorySearchInput, #vehicleSearchInput {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 3px solid black;
            border-radius: 4px;
            font-size: 16px;
        }

        .results-section {
            margin-bottom: 30px;
        }

        .results-section h3 {
            color: hotpink;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .save-button {
            background-color: hotpink;
            color: black;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.3);
            cursor: pointer;
            margin-top: 10px;
        }

        .save-button:hover {
            opacity: 0.9;
        }

        #saveStatus, #saveVehicleStatus {
            margin-left: 10px;
            color: green;
            font-weight: bold;
        }

        .no-results {
            padding: 20px;
            background: white;
            border-radius: 5px;
            color: #666;
        }

        .stock-indicator {
            color: green;
            font-weight: bold;
        }

        .no-stock {
            color: #999;
        }

        .compatible-list {
            background: white;
            padding: 15px;
            margin-top: 10px;
            border-radius: 5px;
        }

        .compatible-list h4 {
            color: hotpink;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .compatible-list ul {
            list-style: none;
            padding: 0;
            margin: 0;
            column-count: 2;
            column-gap: 20px;
        }

        .compatible-list li {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }

        .notes-display {
            background: #fffacd;
            padding: 10px;
            margin-top: 10px;
            border-left: 4px solid hotpink;
            border-radius: 4px;
        }

        .notes-display strong {
            color: hotpink;
        }

        /* Data Management Styles */
        .data-management-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .file-list-container {
            flex: 1;
        }

        .file-list-box {
            border: 2px solid #ccc;
            border-radius: 5px;
            background: white;
            height: 400px;
            overflow-y: auto;
            padding: 15px;
        }

        .file-item {
            padding: 12px;
            margin-bottom: 10px;
            background: #f9f9f9;
            border-radius: 5px;
            border-left: 4px solid hotpink;
        }

        .file-item label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
        }

        .file-item input[type="checkbox"] {
            margin-top: 3px;
        }

        .file-details {
            flex: 1;
        }

        .file-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .file-meta {
            font-size: 12px;
            color: #666;
        }

        .management-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Scroll to top button */
        .scroll-top-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: hotpink;
            color: black;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: none;
            z-index: 1000;
        }

        .scroll-top-btn:hover {
            opacity: 0.8;
        }

        /* Compact expand button for grouped inventory */
        .expand-btn {
            background: transparent;
            border: none;
            color: hotpink;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .expand-btn .arrow {
            font-size: 14px;
            line-height: 1;
        }
        .expand-btn .count {
            font-size: 12px;
            color: #666;
        }

        @media (max-width: 600px) {
            .tab {
                font-size: 14px;
                padding: 10px;
            }

            th, td {
                font-size: 12px;
            }

            .compatible-list ul {
                column-count: 1;
            }

            .data-management-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="tab-container">
        <div id="searchTab" class="tab active" onclick="switchTab('search')">Quick Search</div>
        <div id="inventoryTab" class="tab" onclick="switchTab('inventory')">Inventory</div>
        <div id="vehicleTab" class="tab" onclick="switchTab('vehicle')">Vehicle Reference</div>
        <div id="dataTab" class="tab" onclick="switchTab('data')">Data Management</div>
    </div>

    <!-- Quick Search Tab -->
    <div id="searchContent" class="tab-content active">
        <input type="text" id="searchInput" placeholder="Search for vehicle (e.g., 2014 Chevrolet Camaro) - try Make, Model, Year" oninput="performQuickSearch()" />
        
        <div style="margin-top: 10px; margin-bottom: 10px;">
            <label style="cursor: pointer;">
                <input type="checkbox" id="inStockOnly" onchange="performQuickSearch()" style="margin-right: 5px;">
                Show in-stock items only
            </label>
        </div>
        
        <div class="results-section">
            <div id="searchResults" class="no-results">Enter a vehicle to find compatible keys...</div>
        </div>
    </div>

    <!-- Inventory Tab -->
    <div id="inventoryContent" class="tab-content">
        <button class="save-button" onclick="saveInventory()">Save Changes</button>
        <span id="saveStatus"></span>
        
        <button class="save-button" onclick="exportInventory()" style="margin-left: 10px;">Export to CSV</button>
        
        <div style="margin-top: 15px; margin-bottom: 10px;">
            <button class="save-button" onclick="addNewInventoryRow()">+ Add New Row</button>
            <button class="save-button" onclick="deleteSelectedRows()" style="margin-left: 10px; background-color: #ff6b6b;">Delete Selected</button>
        </div>
        
        <input type="text" id="inventorySearchInput" placeholder="Search inventory (e.g., Product, Make, Model, Year)" oninput="filterInventory()" style="margin-top: 15px;" />
        
        <div style="margin-top: 10px; margin-bottom: 10px;">
            <label style="cursor: pointer;">
                <input type="checkbox" id="inventoryInStockOnly" onchange="displayInventory()" style="margin-right: 5px;">
                Search in-stock items only
            </label>
        </div>
        
        <div style="margin-top: 10px; margin-bottom: 10px; display: flex; gap: 20px; align-items: center;">
            <strong>View:</strong>
            <label style="cursor: pointer;">
                <input type="radio" name="inventoryView" value="grouped" checked onchange="displayInventory()" style="margin-right: 5px;">
                Grouped by Key
            </label>
            <label style="cursor: pointer;">
                <input type="radio" name="inventoryView" value="vehicle" onchange="displayInventory()" style="margin-right: 5px;">
                By Vehicle
            </label>
        </div>
        
        <div id="inventoryTableContainer"></div>
        
        <button class="scroll-top-btn" id="inventoryScrollBtn" onclick="scrollToTop()">↑</button>
    </div>

    <!-- Vehicle Reference Tab -->
    <div id="vehicleContent" class="tab-content">
        <button class="save-button" onclick="saveVehicles()">Save Changes</button>
        <span id="saveVehicleStatus"></span>
        
        <button class="save-button" onclick="exportVehicles()" style="margin-left: 10px;">Export to CSV</button>
        
        <input type="text" id="vehicleSearchInput" placeholder="Search vehicles (e.g., Toyota Camry 2015)" oninput="filterVehicles()" style="margin-top: 15px;" />
        <div id="vehicleTableContainer"></div>
        
        <button class="scroll-top-btn" id="vehicleScrollBtn" onclick="scrollToTop()">↑</button>
    </div>

    <!-- Data Management Tab -->
    <div id="dataContent" class="tab-content">
        <h3>File Management</h3>
        <div class="data-management-container">
            <div class="file-list-container">
                <h4>📁 Loaded Files:</h4>
                <div class="file-list-box" id="fileListBox">
                    <div style="color: #999; text-align: center; padding: 50px;">
                        No files loaded. Import a CSV to get started.
                    </div>
                </div>
            </div>
            
            <div class="management-buttons">
                <button class="save-button" onclick="document.getElementById('inventoryFileInput').click()">Import Inventory CSV</button>
                <input type="file" id="inventoryFileInput" accept=".csv" style="display: none;" onchange="importInventory(event)" />
                
                <button class="save-button" onclick="document.getElementById('vehicleFileInput').click()">Import Vehicle Ref CSV</button>
                <input type="file" id="vehicleFileInput" accept=".csv" style="display: none;" onchange="importVehicleReference(event)" />
                
                <button class="save-button" onclick="deleteSelectedFiles()">Delete Selected</button>
                
                <button class="save-button" onclick="resetEverything()" style="background-color: #ff3333; margin-top: 20px; font-size: 24px; border-radius: 8px; width: 60px; height: 60px;">Reset</button>
            </div>
        </div>
    </div>

    <script>
        // IndexedDB Setup
        let db;
        const DB_NAME = 'TransponderDB';
        const DB_VERSION = 3; // Increment for new schema
        const INVENTORY_STORE = 'inventory';
        const VEHICLE_STORE = 'vehicles';
        const FILES_STORE = 'files'; // New store to track imported files

        // Keep expanded groups across renders (store safe keys)
        window.inventoryExpanded = window.inventoryExpanded || new Set();

        // Initialize IndexedDB
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                
                request.onupgradeneeded = (event) => {
                    db = event.target.result;
                    
                    // Create inventory store with new structure
                    if (!db.objectStoreNames.contains(INVENTORY_STORE)) {
                        const inventoryStore = db.createObjectStore(INVENTORY_STORE, { keyPath: 'id', autoIncrement: true });
                        inventoryStore.createIndex('Make', 'Make', { unique: false });
                        inventoryStore.createIndex('Model', 'Model', { unique: false });
                        inventoryStore.createIndex('Product_Name', 'Product_Name', { unique: false });
                    }
                    
                    // Create vehicle reference store
                    if (!db.objectStoreNames.contains(VEHICLE_STORE)) {
                        const vehicleStore = db.createObjectStore(VEHICLE_STORE, { autoIncrement: true });
                        vehicleStore.createIndex('Make', 'Make', { unique: false });
                        vehicleStore.createIndex('Model', 'Model', { unique: false });
                    }
                    
                    // Create files tracking store
                    if (!db.objectStoreNames.contains(FILES_STORE)) {
                        const filesStore = db.createObjectStore(FILES_STORE, { keyPath: 'id', autoIncrement: true });
                        filesStore.createIndex('filename', 'filename', { unique: false });
                        filesStore.createIndex('type', 'type', { unique: false });
                    }
                };
            });
        }

        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
            document.getElementById(tab + "Tab").classList.add("active");
            document.getElementById(tab + "Content").classList.add("active");
            
            // Load data when switching tabs
            if (tab === 'inventory') {
                displayInventory();
            } else if (tab === 'vehicle') {
                displayVehicles();
            } else if (tab === 'data') {
                displayFileList();
            }
        }

        // Import Inventory CSV with flexible column mapping
        function importInventory(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const filename = file.name;
            
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: async (results) => {
                    const transaction = db.transaction([INVENTORY_STORE, FILES_STORE], 'readwrite');
                    const inventoryStore = transaction.objectStore(INVENTORY_STORE);
                    const filesStore = transaction.objectStore(FILES_STORE);
                    
                    const fileId = Date.now();
                    
                    // Column mapping - accepts variations
                    const mapColumn = (row, variations) => {
                        for (let v of variations) {
                            if (row[v] !== undefined) return row[v];
                        }
                        return '';
                    };
                    
                    // Add new data
                    results.data.forEach(row => {
                        const item = {
                            Make: mapColumn(row, ['Make', 'make']),
                            Model: mapColumn(row, ['Model', 'model']),
                            'Year(s)': mapColumn(row, ['Year(s)', 'Year_Range', 'Years', 'Year', 'year']),
                            'Product_Name': mapColumn(row, ['Product_Name', 'Product Name', 'Key Name', 'Transponder Key', 'Name']),
                            Type: mapColumn(row, ['Type', 'Type(s)', 'type', 'Key Type']),
                            Qty: mapColumn(row, ['Qty', 'Quantity', 'My Total Qty', 'Stock', 'Current Stock']) || '0',
                            Notes: mapColumn(row, ['Notes', 'notes', 'Note']) || '',
                            _fileId: fileId
                        };
                        
                        inventoryStore.add(item);
                    });
                    
                    // Track the file
                    filesStore.add({
                        filename: filename,
                        type: 'Inventory',
                        importDate: new Date().toISOString(),
                        recordCount: results.data.length,
                        fileId: fileId
                    });
                    
                    transaction.oncomplete = () => {
                        alert(`Inventory imported successfully!\n${results.data.length} items added.`);
                        displayInventory();
                        displayFileList();
                        event.target.value = ''; // Reset file input
                    };
                    
                    transaction.onerror = () => {
                        alert('Error importing inventory!');
                    };
                }
            });
        }

        // Import Vehicle Reference CSV
        function importVehicleReference(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const filename = file.name;
            
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: async (results) => {
                    const transaction = db.transaction([VEHICLE_STORE, FILES_STORE], 'readwrite');
                    const vehicleStore = transaction.objectStore(VEHICLE_STORE);
                    const filesStore = transaction.objectStore(FILES_STORE);
                    
                    const fileId = Date.now();
                    
                    // Add new data
                    results.data.forEach(row => {
                        const cleanRow = {
                            Make: row.Make || '',
                            Model: row.Model || '',
                            Year_Range: row.Year_Range || row.Year || '',
                            Product_Name: row.Product_Name || row['Transponder Key'] || '',
                            Qty: row.Qty || '0',
                            Notes: row.Notes || '',
                            _fileId: fileId
                        };
                        
                        vehicleStore.add(cleanRow);
                    });
                    
                    // Track the file
                    filesStore.add({
                        filename: filename,
                        type: 'Vehicle Reference',
                        importDate: new Date().toISOString(),
                        recordCount: results.data.length,
                        fileId: fileId
                    });
                    
                    transaction.oncomplete = () => {
                        alert(`Vehicle reference imported successfully!\n${results.data.length} items added.`);
                        displayVehicles();
                        displayFileList();
                        event.target.value = ''; // Reset file input
                    };
                    
                    transaction.onerror = () => {
                        alert('Error importing vehicle reference!');
                    };
                }
            });
        }

        // Display File List
        function displayFileList() {
            const transaction = db.transaction([FILES_STORE], 'readonly');
            const store = transaction.objectStore(FILES_STORE);
            const request = store.getAll();
            
            request.onsuccess = () => {
                const files = request.result;
                const container = document.getElementById('fileListBox');
                
                if (files.length === 0) {
                    container.innerHTML = '<div style="color: #999; text-align: center; padding: 50px;">No files loaded. Import a CSV to get started.</div>';
                    return;
                }
                
                let html = '';
                files.forEach(file => {
                    const date = new Date(file.importDate).toLocaleDateString();
                    html += `
                        <div class="file-item">
                            <label>
                                <input type="checkbox" class="file-checkbox" data-file-id="${file.id}" data-internal-id="${file.fileId}">
                                <div class="file-details">
                                    <div class="file-name">${file.filename}</div>
                                    <div class="file-meta">
                                        Type: ${file.type} | ${file.recordCount} items | Imported: ${date}
                                    </div>
                                </div>
                            </label>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            };
        }

        // Delete Selected Files
        function deleteSelectedFiles() {
            const checkboxes = document.querySelectorAll('.file-checkbox:checked');
            if (checkboxes.length === 0) {
                alert('Please select files to delete');
                return;
            }
            
            if (!confirm(`Delete ${checkboxes.length} file(s) and all associated data?`)) {
                return;
            }
            
            const fileIds = Array.from(checkboxes).map(cb => parseInt(cb.dataset.fileId));
            const internalIds = Array.from(checkboxes).map(cb => parseInt(cb.dataset.internalId));
            
            const transaction = db.transaction([INVENTORY_STORE, VEHICLE_STORE, FILES_STORE], 'readwrite');
            const inventoryStore = transaction.objectStore(INVENTORY_STORE);
            const vehicleStore = transaction.objectStore(VEHICLE_STORE);
            const filesStore = transaction.objectStore(FILES_STORE);
            
            // Delete file records
            fileIds.forEach(id => filesStore.delete(id));
            
            // Delete associated data from inventory
            const invRequest = inventoryStore.openCursor();
            invRequest.onsuccess = (event) => {
                const cursor = event.target.result;
                if (cursor) {
                    if (internalIds.includes(cursor.value._fileId)) {
                        cursor.delete();
                    }
                    cursor.continue();
                }
            };
            
            // Delete associated data from vehicles
            const vehRequest = vehicleStore.openCursor();
            vehRequest.onsuccess = (event) => {
                const cursor = event.target.result;
                if (cursor) {
                    if (internalIds.includes(cursor.value._fileId)) {
                        cursor.delete();
                    }
                    cursor.continue();
                }
            };
            
            transaction.oncomplete = () => {
                alert('Selected files deleted successfully!');
                displayFileList();
                displayInventory();
                displayVehicles();
            };
        }

        // Helper function to check if a year is within a range
        function yearMatchesRange(searchYear, dataValue) {
            if (!dataValue || typeof dataValue !== 'string') return false;
            const rangeMatch = dataValue.match(/(\d{4})\s*[-–—]\s*(\d{4})/);
            const ongoingMatch = dataValue.match(/(\d{4})\s*\+/);
            
            if (rangeMatch) {
                const startYear = parseInt(rangeMatch[1]);
                const endYear = parseInt(rangeMatch[2]);
                return searchYear >= startYear && searchYear <= endYear;
            }
            
            if (ongoingMatch) {
                const startYear = parseInt(ongoingMatch[1]);
                const currentYear = new Date().getFullYear();
                return searchYear >= startYear && searchYear <= currentYear;
            }
            
            return false;
        }

        // Helper function to check if item is in stock
        function isInStock(qty) {
            if (qty === null || qty === undefined) return false;
            const qtyStr = qty.toString().trim();
            if (qtyStr === '' || qtyStr === '0') return false;
            return true;
        }

        // Display Inventory Table
        function displayInventory(filterText = '') {
            const transaction = db.transaction([INVENTORY_STORE], 'readonly');
            const store = transaction.objectStore(INVENTORY_STORE);
            const request = store.getAll();
            
            request.onsuccess = () => {
                let data = request.result || [];
                
                if (filterText) {
                    const searchTerms = filterText.toLowerCase().trim().split(/\s+/);
                    data = data.filter(item => {
                        return searchTerms.every(term => {
                            const yearMatch = term.match(/^\d{4}$/);
                            if (yearMatch) {
                                const searchYear = parseInt(term);
                                return Object.values(item).some(val => {
                                    if (!val) return false;
                                    const valStr = val.toString().toLowerCase();
                                    return valStr.includes(term) || yearMatchesRange(searchYear, valStr);
                                });
                            }
                            return Object.values(item).some(val => 
                                val && val.toString().toLowerCase().includes(term)
                            );
                        });
                    });
                }
                
                // Filter by in-stock if checkbox is checked
                const inStockOnly = document.getElementById('inventoryInStockOnly')?.checked;
                if (inStockOnly) {
                    data = data.filter(item => isInStock(item.Qty));
                }
                
                const container = document.getElementById('inventoryTableContainer');
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="no-results">No inventory data. Import a CSV file to get started.</div>';
                    return;
                }
                
                // Check which view is selected
                const viewMode = document.querySelector('input[name="inventoryView"]:checked')?.value || 'grouped';
                
                if (viewMode === 'grouped') {
                    displayGroupedInventory(data, container);
                } else {
                    displayVehicleInventory(data, container);
                }
            };
        }
        
        // Display grouped inventory (by Product_Name)
        function displayGroupedInventory(data, container) {
            // Group by Product_Name
            const grouped = {};
            data.forEach(item => {
                const key = item.Product_Name || 'Unknown Product';
                if (!grouped[key]) {
                    grouped[key] = {
                        product: key,
                        qty: item.Qty,
                        notes: item.Notes,
                        type: item.Type,
                        vehicles: [],
                        ids: []
                    };
                }
                grouped[key].vehicles.push({
                    make: item.Make,
                    model: item.Model,
                    year: item['Year(s)']
                });
                grouped[key].ids.push(item.id);
            });
            
            const groupedArray = Object.values(grouped);
            
            // Apply sorting if exists
            if (window.inventorySortColumn) {
                groupedArray.sort((a, b) => {
                    let aVal = a.product || '';
                    let bVal = b.product || '';
                    if (aVal < bVal) return window.inventorySortDirection === 'asc' ? -1 : 1;
                    if (aVal > bVal) return window.inventorySortDirection === 'asc' ? 1 : -1;
                    return 0;
                });
            }
            
            let html = '<table id="inventoryTable"><thead><tr>';
            html += '<th style="width: 40px;"><input type="checkbox" id="selectAllInventory" onchange="toggleSelectAll(\'inventory\')"></th>';
            html += '<th class="sortable" onclick="sortInventoryTable(\'Product_Name\')">Product Name</th>';
            html += '<th style="width: 120px;">Vehicles</th>';
            html += '<th style="width: 80px;">Qty</th>';
            html += '<th>Notes</th>';
            html += '</tr></thead><tbody>';
            
            groupedArray.forEach((group, index) => {
                const qtyClass = isInStock(group.qty) ? 'stock-indicator' : 'no-stock';
                // create a safe key to persist expansion across sorting/re-renders
                const safeKey = (group.product || 'Unknown_Product').replace(/[^a-z0-9_\-]/gi, '_').slice(0, 80);
                const expanded = window.inventoryExpanded.has(safeKey);
                const arrow = expanded ? '▾' : '▸';
                html += `<tr data-group-key="${safeKey}">`;
                html += `<td><input type="checkbox" class="row-checkbox" data-ids="${group.ids.join(',')}"></td>`;
                html += `<td contenteditable="true" data-field="Product_Name" data-ids="${group.ids.join(',')}">${group.product}</td>`;
                // compact expand control with arrow + count
                html += `<td style="text-align: center;"><button type="button" class="expand-btn" data-count="${group.vehicles.length}" onclick="toggleVehicleList('${safeKey}')" aria-expanded="${expanded ? 'true' : 'false'}" aria-label="Toggle vehicle list" title="${group.vehicles.length} vehicles"><span class="arrow">${arrow}</span><span class="count">${group.vehicles.length}</span></button></td>`;
                html += `<td contenteditable="true" class="${qtyClass}" data-field="Qty" data-ids="${group.ids.join(',')}">${group.qty || 0}</td>`;
                html += `<td contenteditable="true" data-field="Notes" data-ids="${group.ids.join(',')}">${group.notes || ''}</td>`;
                html += '</tr>';
                
                // Add expandable vehicle list row
                html += `<tr id="vehicleList-${safeKey}" style="display: ${expanded ? 'table-row' : 'none'};"><td colspan="5">`;
                html += '<div style="background: #f9f9f9; padding: 10px; border-left: 3px solid hotpink;"><strong>Compatible with:</strong>';
                html += '<table style="width:100%; margin-top:10px;"><tr><th>Make</th><th>Model</th><th>Year</th></tr>';
                group.vehicles.forEach((v, vIndex) => {
                    const vehicleId = group.ids[vIndex];
                    html += `<tr><td contenteditable="true" data-id="${vehicleId}" data-field="Make">${v.make}</td>`;
                    html += `<td contenteditable="true" data-id="${vehicleId}" data-field="Model">${v.model}</td>`;
                    html += `<td contenteditable="true" data-id="${vehicleId}" data-field="Year(s)">${v.year}</td></tr>`;
                });
                html += '</table>';
                // pass the product name to addVehicleToGroup; escape single-quotes
                const escapedProduct = (group.product || '').replace(/'/g, "\\'");
                html += `<button type="button" onclick="addVehicleToGroup('${safeKey}','${escapedProduct}')" style="margin-top:10px; padding:5px 10px; background:hotpink; color:white; border:none; border-radius:4px; cursor: pointer;">+ Add Vehicle</button>`;
                html += '</div></td></tr>';
            });
            
            html += '</tbody></table>';
            html += `<div style="margin-top: 10px; color: #666;">Showing ${groupedArray.length} unique keys (${data.length} vehicles total)</div>`;
            container.innerHTML = html;
        }
        
        // Display vehicle inventory (ungrouped)
        function displayVehicleInventory(data, container) {
            const headers = ['Make', 'Model', 'Year(s)', 'Product_Name', 'Type', 'Qty', 'Notes'];
            
            // Apply sorting if sort state exists
            if (window.inventorySortColumn) {
                data = sortData(data, window.inventorySortColumn, window.inventorySortDirection);
            }
            
            let html = '<table id="inventoryTable"><thead><tr>';
            html += '<th style="width: 40px;"><input type="checkbox" id="selectAllInventory" onchange="toggleSelectAll(\'inventory\')"></th>';
            headers.forEach(h => {
                const displayName = h === 'Product_Name' ? 'Product Name' : h;
                const sortClass = window.inventorySortColumn === h ? 
                    (window.inventorySortDirection === 'asc' ? 'sorted-asc' : 'sorted-desc') : 'sortable';
                html += `<th class="${sortClass}" onclick="sortInventoryTable('${h}')">${displayName}</th>`;
            });
            html += '</tr></thead><tbody>';
            
            data.forEach(row => {
                html += '<tr data-row-id="' + row.id + '">';
                html += '<td><input type="checkbox" class="row-checkbox" value="' + row.id + '"></td>';
                headers.forEach(h => {
                    html += `<td contenteditable="true" data-field="${h}">${row[h] || ''}</td>`;
                });
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            html += `<div style="margin-top: 10px; color: #666;">Showing ${data.length} vehicle entries</div>`;
            container.innerHTML = html;
        }
        
        // Add vehicle to group
        // now accepts safeKey and productName (safeKey is used only for locating UI rows if needed)
        function addVehicleToGroup(safeKey, productName) {
            const make = prompt('Enter Make:');
            if (!make) return;
            const model = prompt('Enter Model:');
            if (!model) return;
            const year = prompt('Enter Year(s):');
            if (!year) return;
            
            const transaction = db.transaction([INVENTORY_STORE], 'readwrite');
            const store = transaction.objectStore(INVENTORY_STORE);
            
            const newItem = {
                Make: make.toUpperCase(),
                Model: model,
                'Year(s)': year,
                Product_Name: productName,
                Type: '',
                Qty: '0',
                Notes: ''
            };
            
            store.add(newItem);
            
            transaction.oncomplete = () => {
                displayInventory();
            };
        }

        // Toggle vehicle list in grouped view (also toggles arrow and stores expanded state)
        function toggleVehicleList(key) {
            const row = document.getElementById('vehicleList-' + key);
            const btn = document.querySelector(`tr[data-group-key="${key}"] .expand-btn`);
            const isHidden = !row || row.style.display === 'none' || row.style.display === '';
            if (row) {
                row.style.display = isHidden ? 'table-row' : 'none';
            }
            if (btn) {
                const count = parseInt(btn.dataset.count, 10) || 0;
                const arrowEl = btn.querySelector('.arrow');
                if (arrowEl) {
                    arrowEl.textContent = isHidden ? '▾' : '▸';
                } else {
                    btn.textContent = (isHidden ? '▾ ' : '▸ ') + count;
                }
                btn.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
            }
            // persist expansion state across re-renders (use safe key)
            if (isHidden) window.inventoryExpanded.add(key); else window.inventoryExpanded.delete(key);
        }

        // Display Vehicle Reference Table
        function displayVehicles(filterText = '') {
            const transaction = db.transaction([VEHICLE_STORE], 'readonly');
            const store = transaction.objectStore(VEHICLE_STORE);
            const request = store.getAll();
            
            request.onsuccess = () => {
                let data = request.result;
                
                if (filterText) {
                    const searchTerms = filterText.toLowerCase().trim().split(/\s+/);
                    data = data.filter(item => {
                        return searchTerms.every(term => {
                            const yearMatch = term.match(/^\d{4}$/);
                            if (yearMatch) {
                                const searchYear = parseInt(term);
                                return Object.values(item).some(val => {
                                    if (!val) return false;
                                    const valStr = val.toString().toLowerCase();
                                    return valStr.includes(term) || yearMatchesRange(searchYear, valStr);
                                });
                            }
                            return Object.values(item).some(val => 
                                val && val.toString().toLowerCase().includes(term)
                            );
                        });
                    });
                }
                
                const container = document.getElementById('vehicleTableContainer');
                
                if (data.length === 0) {
                    container.innerHTML = '<div class="no-results">No vehicle data. Import a CSV file to get started.</div>';
                    return;
                }
                
                const headers = ['Make', 'Model', 'Year_Range', 'Product_Name', 'Qty', 'Notes'];
                let html = '<table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
                
                data.forEach(row => {
                    html += '<tr data-row-id="' + row.id + '">' + headers.map(h => 
                        `<td contenteditable="true" data-field="${h}">${row[h] || ''}</td>`
                    ).join('') + '</tr>';
                });
                
                html += '</tbody></table>';
                container.innerHTML = html;
            };
        }

        // Quick Search - searches INVENTORY database
        function performQuickSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!query) {
                document.getElementById('searchResults').innerHTML = '<div class="no-results">Enter a vehicle to find compatible keys...</div>';
                return;
            }
            
            const searchTerms = query.split(/\s+/);
            
            // Search INVENTORY database
            const inventoryTransaction = db.transaction([INVENTORY_STORE], 'readonly');
            const inventoryStore = inventoryTransaction.objectStore(INVENTORY_STORE);
            const inventoryRequest = inventoryStore.getAll();
            
            inventoryRequest.onsuccess = () => {
                let items = inventoryRequest.result.filter(item => {
                    return searchTerms.every(term => {
                        const yearMatch = term.match(/^\d{4}$/);
                        if (yearMatch) {
                            const searchYear = parseInt(term);
                            return Object.values(item).some(val => {
                                if (!val) return false;
                                const valStr = val.toString().toLowerCase();
                                return valStr.includes(term) || yearMatchesRange(searchYear, valStr);
                            });
                        }
                        return Object.values(item).some(val => 
                            val && val.toString().toLowerCase().includes(term)
                        );
                    });
                });
                
                // Filter by in-stock if checkbox is checked
                const inStockOnly = document.getElementById('inStockOnly')?.checked;
                if (inStockOnly) {
                    items = items.filter(item => isInStock(item.Qty));
                }
                
                if (items.length === 0) {
                    document.getElementById('searchResults').innerHTML = '<div class="no-results">No items found in inventory.</div>';
                    return;
                }
                
                // If only ONE result, show full details with compatibility
                if (items.length === 1) {
                    const matchedItem = items[0];
                    const keyName = matchedItem.Product_Name || 'Unknown Key';
                    
                    // Get all items that use this same key
                    const allItemsWithKey = inventoryRequest.result.filter(item => 
                        (item.Product_Name || 'Unknown Key') === keyName
                    );
                    
                    displaySearchResult(matchedItem, allItemsWithKey);
                } else {
                    // For multiple results show a compact list
                    const html = `<table><thead><tr><th>Product</th><th>Make</th><th>Model</th><th>Year</th><th>Qty</th></tr></thead><tbody>` +
                        items.map(it => `<tr data-id="${it.id}"><td>${it.Product_Name || ''}</td><td>${it.Make || ''}</td><td>${it.Model || ''}</td><td>${it['Year(s)'] || ''}</td><td>${it.Qty || ''}</td></tr>`).join('') +
                        `</tbody></table>`;
                    document.getElementById('searchResults').innerHTML = html;
                }
            };
        }

        // Display search result for a single matched item
        function displaySearchResult(item, allItemsWithKey) {
            const container = document.getElementById('searchResults');
            let html = `<div class="compatible-list"><h4>${item.Product_Name || 'Unknown Key'}</h4>`;
            html += `<div><strong>Type:</strong> ${item.Type || ''} <strong style="margin-left:20px;">Qty:</strong> ${item.Qty || 0}</div>`;
            if (item.Notes) html += `<div class="notes-display"><strong>Notes:</strong> ${item.Notes}</div>`;
            html += `<h4 style="margin-top:10px;">Compatible Vehicles</h4>`;
            html += '<table style="width:100%;"><thead><tr><th>Make</th><th>Model</th><th>Year(s)</th></tr></thead><tbody>';
            allItemsWithKey.forEach(v => {
                html += `<tr><td>${v.Make || ''}</td><td>${v.Model || ''}</td><td>${v['Year(s)'] || ''}</td></tr>`;
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        // Placeholder functions for features referenced in markup but not shown in this file
        function toggleSelectAll(context) {
            const checked = document.getElementById('selectAllInventory')?.checked;
            document.querySelectorAll('#inventoryTable .row-checkbox').forEach(cb => cb.checked = !!checked);
        }

        function sortInventoryTable(column) {
            if (window.inventorySortColumn === column) {
                window.inventorySortDirection = window.inventorySortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                window.inventorySortColumn = column;
                window.inventorySortDirection = 'asc';
            }
            displayInventory(document.getElementById('inventorySearchInput')?.value || '');
        }

        function sortData(data, column, direction) {
            return data.slice().sort((a, b) => {
                const aVal = (a[column] || '').toString().toLowerCase();
                const bVal = (b[column] || '').toString().toLowerCase();
                if (aVal < bVal) return direction === 'asc' ? -1 : 1;
                if (aVal > bVal) return direction === 'asc' ? 1 : -1;
                return 0;
            });
        }

        function filterInventory() {
            displayInventory(document.getElementById('inventorySearchInput')?.value || '');
        }

        function filterVehicles() {
            displayVehicles(document.getElementById('vehicleSearchInput')?.value || '');
        }

        function saveInventory() { document.getElementById('saveStatus').textContent = 'Saved'; setTimeout(()=>document.getElementById('saveStatus').textContent='',1500); }
        function exportInventory() { alert('Export not implemented in this patch'); }
        function addNewInventoryRow() { alert('Add new row not implemented in this patch'); }
        function deleteSelectedRows() { alert('Delete selected not implemented in this patch'); }
        function saveVehicles() { document.getElementById('saveVehicleStatus').textContent = 'Saved'; setTimeout(()=>document.getElementById('saveVehicleStatus').textContent='',1500); }
        function exportVehicles() { alert('Export not implemented in this patch'); }
        function resetEverything() { if(confirm('Reset database and remove all imported data?')) { const req = indexedDB.deleteDatabase(DB_NAME); req.onsuccess = ()=>{ alert('Database reset. Reloading.'); location.reload(); }; } }
        function scrollToTop() { window.scrollTo({top:0, behavior:'smooth'}); }

        // Initialize DB on load
        window.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            // initial load
            displayFileList();
            // pre-load inventory and vehicles so placeholders and UI states are consistent
            displayInventory();
            displayVehicles();
        });
    </script>
</body>
